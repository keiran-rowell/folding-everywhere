[package]
name = "esmfold1"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust fp32/fp8 reimplementation of ESMFold v1"

[lib]
name = "esmfold1"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fold"
path = "src/bin/fold.rs"

[dependencies]
safetensors = "0.4"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
libm = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1.10"

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
memmap2 = "0.9"

[target.'cfg(any(target_arch = "wasm32", target_arch = "wasm64"))'.dependencies]
pollster = "0.3"
futures-intrusive = "0.5"
wasm-bindgen-futures = "0.4"
wgpu = { version = "24", default-features = false, features = ["wgsl", "webgpu"] }
wasm-bindgen = "0.2.120"
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen-rayon = "1.3"

[profile.release]
debug = true
opt-level = 3
panic = "abort"
