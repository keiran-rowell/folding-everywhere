[package]
name = "esmfold1"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust fp32 reimplementation of ESMFold v1"

[lib]
name = "esmfold"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fold"
path = "src/bin/fold.rs"

[dependencies]
safetensors = "0.4"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
libm = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
memmap2 = "0.9"
rayon = "1.10"

[target.'cfg(any(target_arch = "wasm32", target_arch = "wasm64"))'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd", "--inline-functions-with-loops"]
